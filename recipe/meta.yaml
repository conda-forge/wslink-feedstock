{% set version = "2.6.0" %}

package:
  name: wslink
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/w/wslink/wslink-{{ version }}.tar.gz
  sha256: 11e6f4a956a90487e31354fe0436edc850e052d9773ea1d14fc708660cb385da

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - aiohttp <4
    - msgpack-python >=1,<2

test:
  imports:
    - wslink
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}.*

about:
  home: https://github.com/kitware/wslink
  summary: Python/JavaScript library for communicating over WebSocket
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jourdain
    - kwrobot
